version: "3.9"

services:
  rudood-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Only NEXT_PUBLIC_* vars need to be known at build time
        NEXT_PUBLIC_N8N_FORM_URL: ${NEXT_PUBLIC_N8N_FORM_URL}
    image: rudood-web:latest
    container_name: rudood-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    # Server-side secrets — injected at runtime, never baked into the image
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
