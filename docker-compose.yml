version: "3.9"

services:
  rudood-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars must be known at build time (Next.js inlines them)
        NEXT_PUBLIC_N8N_FORM_URL:          ${NEXT_PUBLIC_N8N_FORM_URL}
        NEXT_PUBLIC_CHATWOOT_BASE_URL:     ${NEXT_PUBLIC_CHATWOOT_BASE_URL}
        NEXT_PUBLIC_CHATWOOT_INBOX_ID:     ${NEXT_PUBLIC_CHATWOOT_INBOX_ID}
    image: rudood-web:latest
    container_name: rudood-web
    restart: unless-stopped
    ports:
      - "3001:3000"          # host:container — nginx proxies 443 → 3001
    env_file:
      - .env.production      # server-side secrets, never baked into image
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
